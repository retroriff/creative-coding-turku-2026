<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social card preview</title>
  <style>
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #000; }
    .background { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.64) 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.1) 100%); }
    .content { position: relative; z-index: 1; padding: 45px 50px; color: #dc8458; font: 54px/1.14 Menlo, Monaco, Consolas, monospace; letter-spacing: -1.8px; white-space: nowrap; }
    .line { display: table; width: max-content; padding: 0 9px 0 0; background: rgba(0,0,0,.67); }
    .details { margin-top: 54px; }
  </style>
</head>
<body>
  <main class="card" aria-label="Creative Coding Finland / Turku Meetup">
    <img class="background" src="og-background.png" alt="">
    <div class="shade"></div>
    <div class="content">
      <div class="line">// CREATIVE CODING FINLAND</div>
      <div class="line">// TURKU MEETUP</div>
      <div class="details">
        <div class="line">// 14.11.2026 / klo 14–20</div>
        <div class="line">// Fuusio</div>
        <div class="line">// Humalistonkatu 8 A</div>
      </div>
    </div>
  </main>
</body>
</html>
